name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run python scripts/check_no_comments.py
      - run: uv run python scripts/check_features.py
      - run: uv run pytest -m "not sandbox and not real" -q
